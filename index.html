<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}

a.btn2{background:#1e1e1e;color:#fff;border:1px solid #333}
a.btn-wa{background:#25D366;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2px}
.badge{margin-top:22px;font-size:11px;color:#555}
